name: Actualitzar resultats de futbol

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  actualitzar:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar repositori
        uses: actions/checkout@v4

      - name: Obtenir partits en directe
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          mkdir -p data
          curl -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?live=all" \
            -o data/partits.json

      - name: Guardar canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/partits.json
          git diff --cached --quiet || (git commit -m "Actualitza resultats de futbol" && git push)
